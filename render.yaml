# ============================================================
# ResumeSense — Render Blueprint (single-service deploy)
# ============================================================
# One Docker web service builds the React frontend and serves it together with
# the Django API and admin. Deploy with New > Blueprint, pointed at this repo.
#
# SECRET_KEY, JWT_SECRET and DATABASE_URL are wired automatically — nothing to
# set by hand after the first deploy.

databases:
  - name: resumesense-db
    databaseName: resumesense
    user: resumesense
    plan: free           # free Postgres expires after 30 days; bump for prod
    region: oregon

services:
  - type: web
    name: resumesense
    runtime: docker
    repo: https://github.com/faizanfatmi/ResumeSense  # adjust if forked
    branch: main
    region: oregon
    # torch + sentence-transformers are memory-hungry; "starter" (512 MB) will
    # likely OOM. Use "standard" (2 GB) or higher for reliable operation.
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /admin/login/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: resumesense-db
          property: connectionString
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: JWT_ACCESS_TOKEN_LIFETIME_MINUTES
        value: "30"
      - key: JWT_REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
