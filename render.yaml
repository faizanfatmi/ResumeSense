# ============================================================
# ResumeSense — Render Blueprint
# ============================================================
# Deploy with Render's "Blueprints" (New > Blueprint, point at this repo).
# It provisions three resources: a Postgres database, the Django backend
# (Docker), and the React/Vite frontend (static site).
#
# After the FIRST deploy, set one value in the dashboard:
#   frontend service -> Environment -> VITE_API_URL =
#       https://<your-backend-service>.onrender.com/api
#   then trigger a manual "Clear build cache & deploy" of the frontend so the
#   new value is baked into the bundle (Vite reads VITE_* only at build time).
#
# The backend already trusts any *.onrender.com origin via CORS regex, so no
# backend change is needed once the frontend is live.

databases:
  - name: resumesense-db
    databaseName: resumesense
    user: resumesense
    plan: free           # free Postgres expires after 30 days; bump for prod
    region: oregon

services:
  # ---------- Backend: Django + DRF (Docker) ----------
  - type: web
    name: resumesense-backend
    runtime: docker
    repo: https://github.com/faizanfatmi/ResumeSense  # adjust if forked
    branch: main
    region: oregon
    # torch + sentence-transformers are memory-hungry; "starter" (512 MB) will
    # likely OOM. Use "standard" (2 GB) or higher for reliable operation.
    plan: standard
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /admin/login/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: resumesense-db
          property: connectionString
      # Trust any Render subdomain so the exact frontend URL need not be known.
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: '^https://.*\.onrender\.com$'
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: JWT_ACCESS_TOKEN_LIFETIME_MINUTES
        value: "60"
      - key: JWT_REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"

  # ---------- Frontend: React + Vite (static site) ----------
  - type: web
    name: resumesense-frontend
    runtime: static
    repo: https://github.com/faizanfatmi/ResumeSense  # adjust if forked
    branch: main
    rootDir: ./frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Set in the dashboard after the backend URL is known (see header note).
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA fallback so client-side routes resolve to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
