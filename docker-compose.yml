services:
  postgres:
    image: postgres:16-alpine
    container_name: resumesense_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-resumesense}
      POSTGRES_USER: ${DB_USER:-resumesense}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-resumesense}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-resumesense} -d ${DB_NAME:-resumesense}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumesense_backend
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-prod-key-change-me}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,frontend
      - DB_NAME=${DB_NAME:-resumesense}
      - DB_USER=${DB_USER:-resumesense}
      - DB_PASSWORD=${DB_PASSWORD:-resumesense}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    volumes:
      - backend_media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resumesense_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
